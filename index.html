<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分圧・倍率器計算ツール</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Noto Sans JP', sans-serif;
      background: #f5f5f5;
      padding: 16px;
      max-width: 700px;
      margin: 0 auto;
      color: #333;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    h3 { font-size: 17px; margin-bottom: 12px; color: #2E8B57; }
    .credit { text-align: right; font-size: 14px; color: #666; margin-bottom: 4px; }
    label {
      font-size: 18px;
      font-weight: 800;
      color: #2E8B57;
      display: block;
      margin-bottom: 4px;
    }
    input[type="number"] {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .row { display: flex; gap: 12px; }
    .col { flex: 1; }
    .result-box {
      background: #f0fff4;
      padding: 20px;
      border-radius: 10px;
      border-left: 5px solid #2E8B57;
      margin-top: 16px;
    }
    .metric { font-size: 36px; font-weight: bold; color: #2E8B57; margin-top: 4px; }
    .metric-label { font-size: 14px; color: #555; }
    .divider { border: none; border-top: 1px solid #ddd; margin: 16px 0; }
    .settings-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
    }
    .settings-title { font-size: 16px; font-weight: bold; margin-bottom: 14px; }
    .caption { font-size: 13px; color: #666; margin-top: 8px; }
    .back-btn {
      display: block;
      width: 140px;
      margin: 0 auto;
      padding: 12px;
      text-align: center;
      background: #00BFFF;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
    }
    .back-btn:hover { opacity: 0.85; }
    svg { width: 100%; display: block; border-radius: 8px; }
    @media (max-width: 480px) { .row { flex-direction: column; } }
  </style>
</head>
<body>
  <p class="credit">開発/制作：緒方</p>
  <h1>🛠️ 分圧・倍率器計算ツール</h1>
  <hr class="divider">

  <h3>📊 分圧回路のイメージ</h3>
  <svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" style="background:#f9f9f9;">
    <!-- Top horizontal line (V-in rail) -->
    <line x1="180" y1="100" x2="650" y2="100" stroke="#333" stroke-width="4"/>
    <!-- Bottom horizontal line (GND rail) -->
    <line x1="180" y1="350" x2="650" y2="350" stroke="#333" stroke-width="4"/>

    <!-- R1 resistor block -->
    <rect x="155" y="134" width="50" height="70" fill="#444" rx="3"/>
    <!-- R2 resistor block -->
    <rect x="155" y="246" width="50" height="70" fill="#444" rx="3"/>

    <!-- Vertical wires -->
    <line x1="180" y1="100" x2="180" y2="134" stroke="#333" stroke-width="3"/>
    <line x1="180" y1="204" x2="180" y2="246" stroke="#333" stroke-width="3"/>
    <line x1="180" y1="316" x2="180" y2="350" stroke="#333" stroke-width="3"/>

    <!-- Output wire (midpoint to right) -->
    <line x1="180" y1="225" x2="650" y2="225" stroke="#333" stroke-width="3"/>

    <!-- Junction dot at midpoint -->
    <circle cx="180" cy="225" r="7" fill="#333"/>
    <!-- Terminal dots -->
    <circle cx="650" cy="100" r="7" fill="#1E90FF"/>
    <circle cx="650" cy="225" r="7" fill="#1E90FF"/>

    <!-- GND symbol -->
    <line x1="608" y1="350" x2="692" y2="350" stroke="#333" stroke-width="3"/>
    <line x1="622" y1="364" x2="678" y2="364" stroke="#333" stroke-width="3"/>
    <line x1="638" y1="378" x2="662" y2="378" stroke="#333" stroke-width="3"/>

    <!-- Labels -->
    <text x="48" y="180" font-family="Arial, sans-serif" font-size="42" fill="#333" font-weight="bold">R1</text>
    <text x="48" y="293" font-family="Arial, sans-serif" font-size="42" fill="#333" font-weight="bold">R2</text>
    <text x="395" y="88" font-family="Arial, sans-serif" font-size="50" fill="#1E90FF" font-weight="bold">V-in</text>
    <text x="383" y="215" font-family="Arial, sans-serif" font-size="50" fill="#1E90FF" font-weight="bold">V-out</text>
    <text x="588" y="410" font-family="Arial, sans-serif" font-size="38" fill="#333">GND</text>

    <!-- Formula at bottom -->
    <text x="110" y="450" font-family="Arial, sans-serif" font-size="26" fill="#555">V-out = V-in × R2 / (R1 + R2)</text>
  </svg>

  <hr class="divider">

  <div class="settings-card">
    <div class="settings-title">⚙️ 計算設定</div>
    <div class="row">
      <div class="col">
        <label>入力電圧 V-in (V)</label>
        <input type="number" id="vin" value="24.000" step="0.001" oninput="calc()">
      </div>
      <div class="col">
        <label>抵抗 R1 (Ω)</label>
        <input type="number" id="r1" value="1000" step="1" oninput="calc()">
      </div>
    </div>
    <div class="row">
      <div class="col">
        <label>抵抗 R2 (Ω)</label>
        <input type="number" id="r2" value="1000" step="1" oninput="calc()">
      </div>
      <div class="col"></div>
    </div>
  </div>

  <div class="result-box">
    <h3>📊 計算結果</h3>
    <div class="metric-label">出力電圧 V-out (V)</div>
    <div class="metric" id="vout-display">12.000 V</div>
  </div>

  <hr class="divider">
  <p class="caption">※分圧後のV-outは、V-inとGNDの間の電位差となります。GNDレベルの変動には注意してください。</p>
  <hr class="divider">

  <a class="back-btn" href="https://7fjndw39dicdzckugyepb2.streamlit.app/">🏠<br><br>戻る</a>

  <script>
    function calc() {
      const vin = parseFloat(document.getElementById('vin').value) || 0;
      const r1 = parseFloat(document.getElementById('r1').value) || 0;
      const r2 = parseFloat(document.getElementById('r2').value) || 0;
      const vout = (r1 + r2) !== 0 ? vin * (r2 / (r1 + r2)) : 0;
      document.getElementById('vout-display').textContent = vout.toFixed(3) + ' V';
    }
    calc();
  <\/script>
</body>
</html>
